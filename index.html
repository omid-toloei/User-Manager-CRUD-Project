<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="assets/images/favicon.png" />
    <link rel="stylesheet" href="styles/styles.css" />

    <title>User Manager app</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <main class="user-manager">
      <h1>User Manager</h1>

      <div class="user-search">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" placeholder="Search users..." id="searchBox" />
        <p id="showCountResult"></p>
      </div>

      <form class="add-new-user-form" id="newUserForm">
        <legend>Add new user</legend>
        <input type="text" id="newUserInputName" placeholder="Name" required />
        <input type="email" id="newUserInputEmail" placeholder="Email" required />
        <input type="text" id="newUserInputCity" placeholder="City" required />

        <button type="submit" id="newUserSubmitBtn">Add User</button>
      </form>

      <form class="edit-user-form" id="editUserForm">
        <legend>Edit user</legend>
        <input type="text" id="editUserInputName" placeholder="Name" required />
        <input type="email" id="editUserInputEmail" placeholder="Email" required />
        <input type="text" id="editUserInputCity" placeholder="City" required />

        <div>
          <button type="submit" class="save-form-btn" id="editUserSubmitBtn">Save</button>
          <button class="cancel-form-btn" id="editUserCancelBtn">Cancel</button>
        </div>
      </form>
      
      <h2>Users</h2>

      <ul class="user-list"></ul>
    </main>

    <div class="loader-parent">
      <span class="loader"></span>
    </div>

    <div class="app-notification">
      <span class="app-notification-close-icon">✖</span>
      <span id="appNotificationText"></span>
    </div>

    <script src="javascript/app.js"></script>
  </body>
</html>
